  --bg:#FFF4F8; --panel:#FFFFFF; --ink:#5B2A43; --soft:#B27C96; --line:#F9D3E2;
  --rose:#1F1A1C; --rose-weak:#FFE3EE; --rose-deep:#1F1A1C; --pink:#FFA9C9;
  --work:#8A6FE8; --work-weak:#EFEAFF;
  --life:#FFA9C9; --life-weak:#FFE3EE;
  --play:#22A88C; --play-weak:#DDF6F0;
  --warn:#E8772E;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior-y:none;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Gowun Dodum",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.serif{font-family:"Jua",sans-serif}

.app{display:flex;min-height:100%}
main{flex:1;min-width:0;max-width:760px;margin:0 auto;padding:16px 18px 110px}

/* hero */
.hero{display:flex;align-items:flex-end;gap:16px;margin:4px 0 22px}
.hero .day{font-family:"Jua",sans-serif;font-size:88px;line-height:.85;font-weight:700;letter-spacing:-2px}
.hero .meta{padding-bottom:6px}
.hero .meta .m{font-size:15px;color:var(--soft)}
.hero .meta .w{font-family:"Jua",sans-serif;font-size:24px;font-weight:700}
.hello{color:var(--soft);margin:-10px 0 22px}

h2{font-family:"Jua",sans-serif;font-size:19px;margin:28px 0 10px;display:flex;align-items:baseline;gap:8px}
h2 small{font-family:"Gowun Dodum",sans-serif;font-size:13px;color:var(--soft);font-weight:400}
h1.page{font-family:"Jua",sans-serif;font-size:30px;margin:4px 0 16px}

/* filter chips */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 13px;font-size:13px;color:var(--soft)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* list rows */
.list{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .body{flex:1;min-width:0;cursor:pointer}
.row .t{word-break:break-word}
.row .sub{font-size:12.5px;color:var(--soft);margin-top:1px;display:flex;gap:8px;flex-wrap:wrap}
.row.done .t{text-decoration:line-through;color:var(--soft)}
.bar{width:4px;align-self:stretch;border-radius:4px;flex-shrink:0}
.bar.work{background:var(--work)} .bar.life{background:var(--life)} .bar.play{background:var(--play)}
.time{font-variant-numeric:tabular-nums;font-weight:600;min-width:44px;font-size:14px}
.check{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);background:none;flex-shrink:0;
  display:grid;place-items:center;margin-top:1px;padding:0}
.check.on{background:var(--rose);border-color:var(--rose);color:#fff}
.check.on::after{content:"♥";font-size:12px;line-height:1}
.tag{font-size:11.5px;padding:1px 7px;border-radius:6px}
.tag.work{background:var(--work-weak);color:var(--work)}
.tag.life{background:var(--life-weak);color:var(--life)}
.tag.play{background:var(--play-weak);color:var(--play)}
.late{color:var(--warn);font-weight:600}

h2::before,.duo h3::before{content:"";width:16px;height:16px;background:var(--heart) center/contain no-repeat;margin-right:0;align-self:center}
.dateline .ic{width:22px;height:22px;vertical-align:-4px;margin-left:2px}
.drawer nav button .ico{width:26px;height:26px;display:grid;place-items:center}
.drawer nav button .ico .ic{width:26px;height:26px}
.check,.check.on,.drow .check{border:0!important;border-radius:0;background:var(--box) center/contain no-repeat!important;width:24px;height:24px}
.check.on{background-image:var(--boxon)!important}
.check.on::after{content:none}
.star-ic{width:1.05em;height:1.05em;vertical-align:-.15em}
.stk{width:22px;height:22px;margin-right:2px;vertical-align:-5px}
.drow .stk{width:18px;height:18px;vertical-align:-4px}
.cell{position:relative;min-width:0;overflow:hidden}
.cell .lbl{max-width:100%;min-width:0}
.lbl.hol{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.cell .cstk{position:absolute;bottom:3px;right:2px;width:17px;height:17px}
@media (min-width:640px){.cell .cstk{top:4px;right:4px;bottom:auto;width:24px;height:24px}}
.lbl.hol .ic{width:12px;height:12px;vertical-align:-2px}
.shead h3 .ic{width:28px;height:28px;vertical-align:-6px;margin-right:4px}
.ttl .ic{width:24px;height:24px;vertical-align:-5px;margin-left:4px}
.ttl .home{cursor:pointer;-webkit-tap-highlight-color:transparent}
.ttl .home:hover{opacity:.8}
.streak .ic{width:16px;height:16px;vertical-align:-3px}
.empty .ic{width:22px;height:22px;vertical-align:-5px;margin-right:4px}
.stickers{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
.stickers button{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:6px 0 4px;font-size:10.5px;color:var(--soft);display:flex;flex-direction:column;align-items:center;gap:2px}
.stickers button .ic{width:28px;height:28px}
.stickers button[aria-pressed="true"]{border-color:var(--ink);background:#fff;color:var(--ink)}

/* kitty */
.kit{display:inline-block;background-position:center;background-size:contain;background-repeat:no-repeat;flex-shrink:0}
.drawer .kbrand{width:84px;height:84px;margin:0 0 4px 8px}
.dateline{display:flex;align-items:center;gap:6px}
.dateline .kd{width:44px;height:44px;margin-left:auto}
.dateline .wx{display:inline-flex;align-items:center;gap:5px;color:var(--ink)}
.dateline{white-space:nowrap}
.dateline{margin-bottom:6px}
.dateline{flex-wrap:nowrap;min-width:0}
.dateline .dday,.dateline .wx{flex-shrink:0}
.dateline .dday{color:var(--ink)}
@media (max-width:420px){.dateline .wx small{display:none}}
.wxtip{display:inline-flex;gap:4px;min-width:0;overflow:hidden;font-size:12px;font-family:"Gowun Dodum",sans-serif;font-weight:400}
.wxtip[hidden]{display:none}
.wxtip span{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex-shrink:1}
.dateline{margin-bottom:12px}
@media (max-width:480px){.wxtip{font-size:11px}.wxtip span{padding:2px 6px}.dateline .kd{width:36px;height:36px}.dateline .wx{font-size:15px;gap:3px}.dateline .wx small{font-size:11px}.dateline .wx .ic{width:18px;height:18px}.dateline{gap:4px}}
@media (max-width:360px){.dateline .wx small{display:none}}
.dateline .wx small{font-family:"Gowun Dodum",sans-serif;font-size:13px;color:var(--soft);font-weight:400}
.dempty .kit{width:44px;height:44px;display:block;margin:0 0 4px}
.empty .kit{width:40px;height:40px;vertical-align:middle;margin-right:6px}
.scard{position:relative}
.scard .kdoc{position:absolute;right:14px;top:-44px;width:78px;height:78px}
.scard .shead{padding-right:70px}
.alldone{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:14px;color:var(--ink)}
.alldone .kit{width:46px;height:46px}
.result .kit{width:32px;height:32px;vertical-align:middle}
h2 .ic.hic{width:22px;height:22px;vertical-align:-4px}

.daybox{margin-top:12px;grid-template-rows:auto 1fr}
.daybox .dhead{grid-column:1/-1;display:flex;align-items:center;padding:10px 12px 0;font-family:"Jua",sans-serif;font-size:17px}
.daybox .dhead b{flex:1;font-weight:400}
</style>

<script>
(function(){
const CATS={work:"업무",life:"개인",play:"취미"};
const TABS=[["today","홈","k_bear"],["cal","캘린더","calendar"],["todo","할일","clipboard"],["note","메모","openbook"],["habit","루틴","alarm"]];
const TITLES={today:"",cal:"캘린더",todo:"할일",note:"메모",habit:"루틴",settings:"설정"};
const KEYS=["events","todos","notes","habits","shop"];
const WD=["일","월","화","수","목","금","토"];
const ic=(n,cls="")=>n?`<i class="ic i-${n} ${cls}" aria-hidden="true"></i>`:"";
const STICKERS=[["k_heart","키티하트"],["k_wink","키티윙크"],["k_bear","키티곰"],["k_hug","키티포옹"],["k_shy","키티쑥스"],["k_sleep","키티잠"],["k_lie","키티"],["k_doc","키티의사"],["laptop","노트북"],["books","공부"],["openbook","기록"],["cup","카페"],["cosmetics","화장품"],["bag","쇼핑"],["suitcase","짐"],["mirror","거울"],["hospital","병원"],["syringe","주사"],["tooth","치과"],["pills","약"],["dumbbell","운동"],["forkknife","식사"],["bath","목욕"],["mask","피부"],["plane","여행"],["crown","생일"],["alarm","마감"],["bangbang","시험"],["star","촬영"],["heart","하트"],["bow","리본"],["sakura","벚꽃"],["clover","행운"],["note","음악"],["sun","맑음"],["cloud","구름"],["drop","물"],["calendar","일정"],["clipboard","업무"]];
const AUTO=[[/카페|커피|디저트/,"cup"],[/쇼핑|백화점|올리브영|다이소|아울렛/,"bag"],[/공부|독서|강의|수업|스터디/,"books"],[/회의|미팅|교안|작업|보고/,"laptop"],[/화장품/,"cosmetics"],[/병원|진료|검진|내과|외과|안과|이비인후과|피부과|산부인과|한의원/,"hospital"],[/주사|접종|백신|수액|채혈|피검사/,"syringe"],[/치과|스케일링|교정/,"tooth"],[/운동|헬스|PT|필라테스|요가|러닝|수영|댄스|안무|클라이밍|등산/i,"dumbbell"],[/점심|저녁|아침|식사|약속|회식|브런치|맛집|카페|밥/,"forkknife"],[/목욕|스파|찜질|사우나/,"bath"],[/팩|마사지|네일|미용실|헤어|속눈썹|왁싱/,"mask"],[/여행|비행|공항|출장|휴가/,"plane"],[/생일|기념일|파티|공연|축하/,"crown"],[/마감|데드라인|제출/,"alarm"],[/촬영|녹화|라이브/,"star"],[/시험|필기|실기|복원/,"bangbang"],[/영양제|약국|처방/,"pills"]];
const kit=(n,cls="")=>`<i class="kit i-${n} ${cls}" aria-hidden="true"></i>`;
function stickerOf(e){
  if(e.sticker==="none")return"";
  if(e.sticker)return e.sticker;
  if(e.cat==="hol")return"sakura";
  const t=(e.title||"")+" "+(e.note||"");
  for(const[re,k]of AUTO)if(re.test(t))return k;
  return"";
}
function holKo(t){
  t=String(t||"").replace(/ \(.*\)$/,"").trim();
  if(HOL_KO[t])return HOL_KO[t];
  let m=t.match(/^(?:Day off for|Substitute Holiday for|Alternative holiday for)\s+(.*)$/i);
  if(m)return (HOL_KO[m[1]]||m[1])+" 대체공휴일";
  m=t.match(/^Day (before|after) (.*)$/i);
  if(m&&HOL_KO[m[2]])return HOL_KO[m[2]]+" 연휴";
  return t;
}
const HOL_KO={"Armed Forces Day":"국군의 날","Hangeul Proclamation Day":"한글날","Hangeul Day":"한글날","Korean New Year":"설날","Lunar New Year":"설날","Lunar New Year's Day":"설날","Parents' Day":"어버이날","Teachers' Day":"스승의 날","Constitution Day":"제헌절","Labor Day":"근로자의 날","Workers' Day":"근로자의 날","Arbor Day":"식목일","Buddha's Birthday":"부처님오신날","Local Election Day":"지방선거일","Presidential Election Day":"대통령선거일","National Assembly Election Day":"국회의원선거일","Christmas":"크리스마스","New Year's Eve":"연말","Chuseok Day":"추석","New Year's Day":"신정","Seollal":"설날","Day before Seollal":"설날 연휴","Day after Seollal":"설날 연휴","Independence Movement Day":"삼일절","Children's Day":"어린이날","Buddha's Birthday":"부처님오신날","Memorial Day":"현충일","Liberation Day":"광복절","Chuseok":"추석","Chuseok Holiday":"추석 연휴","National Foundation Day":"개천절","Hangul Day":"한글날","Christmas Day":"크리스마스","Christmas Eve":"크리스마스 이브","Election Day":"선거일","Substitute Holiday":"대체공휴일"};

const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const today=()=>ymd(new Date());
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const diffDays=(a,b)=>Math.round((parse(a)-parse(b))/86400000);
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate=s=>{const d=parse(s);return (d.getMonth()+1)+"/"+d.getDate()+"("+WD[d.getDay()]+")"};
const hm=ms=>{const d=new Date(ms);return pad(d.getHours())+":"+pad(d.getMinutes())};

let S={events:[],todos:[],notes:[],habits:[],shop:[]};
const SUPP_SEED=[{id:"s1",time:"아침 공복",name:"유산균"},{id:"s2",time:"점심 식후",name:"오메가3"},{id:"s3",time:"점심 식후",name:"비타민 D3"},{id:"s4",time:"점심 식후",name:"비타민 C"},{id:"s5",time:"저녁~취침 전",name:"마그네슘"}];
let SUPPS=lsGet("supps")||SUPP_SEED;
const SITE_DEF={title:"姫の手帳",footer:"업무 · 개인 · 취미",suppTitle:"영양제"};
let SITE={...SITE_DEF,...(lsGet("site")||{})};
let suppOpen=false;
let V={homeSel:null,tab:"today",filter:"all",month:today().slice(0,7),sel:today(),q:"",showDone:false};

/* ---------- local cache ---------- */
function lsGet(k){try{const v=localStorage.getItem("hub:"+k);return v?JSON.parse(v):null}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem("hub:"+k,JSON.stringify(v))}catch(e){}}
KEYS.forEach(k=>{const v=lsGet(k);if(Array.isArray(v))S[k]=v});
const DEFAULT_API="https://script.google.com/macros/s/AKfycbxtTdawaxliNGjGsWff5wkrBUe06PKgvc0pWE6Lb0xp0AICYhVxYF-3UCMPXN7Dy-l42w/exec";
const CFG={url:lsGet("api")||"",token:lsGet("token")||""};
let FIRST_CONNECT=false;
(()=>{ // 주소 끝에 #t=토큰 을 붙여 열면 이 기기에 자동 연결
  const m=location.hash.match(/[#&]t=([^&]+)/);
  if(!m)return;
  CFG.token=decodeURIComponent(m[1]).trim();CFG.url=CFG.url||DEFAULT_API;
  lsSet("token",CFG.token);lsSet("api",CFG.url);FIRST_CONNECT=true;
  try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}
})();

/* ---------- spreadsheet sync (Apps Script web app) ---------- */
const snap=a=>{const m={};a.forEach(x=>m[x.id]=JSON.stringify(x));return m};
let last={};KEYS.forEach(k=>last[k]=snap(S[k]));
let queue=lsGet("queue")||[];
let NET={state:CFG.url?"busy":"local",msg:"",at:0};
let flushTimer=null,flushing=false,loading=false;

function errMsg(e){
  if(e&&e.code==="unauthorized")return"토큰이 맞지 않아요. 설정에서 토큰을 확인해 주세요.";
  if(e&&e.code==="parse")return"웹앱 응답을 읽지 못했어요. 배포할 때 액세스 권한을 '모든 사용자'로 했는지 확인해 주세요.";
  if(e&&e.code==="server")return"스프레드시트 쪽 오류: "+(e.message||"");
  if(e&&e.code==="http")return"웹앱 주소가 맞는지 확인해 주세요. (HTTP "+e.status+")";
  return"인터넷 연결이나 웹앱 주소를 확인해 주세요.";
}
async function readJson(r){
  if(!r.ok)throw{code:"http",status:r.status};
  let j;try{j=await r.json()}catch(e){throw{code:"parse"}}
  if(j&&j.error)throw{code:j.error,message:j.message};
  return j;
}
async function apiGet(params,cfg=CFG){
  const u=new URL(cfg.url);
  Object.entries({...params,token:cfg.token}).forEach(([k,v])=>u.searchParams.set(k,v));
  return readJson(await fetch(u.toString(),{redirect:"follow"}));
}
async function apiPost(body){
  return readJson(await fetch(CFG.url,{method:"POST",redirect:"follow",
    headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({...body,token:CFG.token})}));
}

function save(k){
  lsSet(k,S[k]);
  const now=snap(S[k]),prev=last[k]||{};
  for(const id in now)if(now[id]!==prev[id])queue.push({op:"upsert",key:k,item:JSON.parse(now[id])});
  for(const id in prev)if(!(id in now))queue.push({op:"delete",key:k,id});
  last[k]=now;lsSet("queue",queue);
  if(!CFG.url)return;
  clearTimeout(flushTimer);flushTimer=setTimeout(flush,700);
}
async function flush(){
  if(!CFG.url||flushing||!queue.length)return;
  flushing=true;NET.mode="save";
  const batch=queue.splice(0);
  const m=new Map();batch.forEach(o=>m.set(o.key+"|"+(o.item?o.item.id:o.id),o));
  NET.state="busy";paintSync();
  try{await apiPost({action:"ops",ops:[...m.values()]});NET.state="ok";NET.msg="";NET.at=Date.now()}
  catch(e){queue=batch.concat(queue);NET.state="err";NET.msg=errMsg(e);clearTimeout(flushTimer);flushTimer=setTimeout(flush,15000)}
  lsSet("queue",queue);flushing=false;paintSync();
  if(queue.length&&NET.state==="ok")flush();
}
async function loadAll(opts={}){
  if(!CFG.url||loading)return;
  loading=true;NET.state="busy";NET.mode="load";NET.t0=Date.now();NET.done=0;NET.total=2;paintSync();
  const calP=Promise.resolve(gLoad(true,!!opts.force)).catch(()=>{}).finally(()=>{NET.done++;paintSync()});   // 캘린더는 시트와 동시에 불러와요
  try{
    if(queue.length){await flush();if(queue.length)throw{code:"pending"}}
    NET.state="busy";NET.mode="load";paintSync();
    let j=null;const ep=window.__EARLY_LOAD;window.__EARLY_LOAD=null;
    if(ep&&!opts.force){try{j=await readJson(await ep)}catch(e){j=null}}
    if(!j)j=await apiGet({action:"load"});
    if(queue.length){loading=false;return}
    const d=j.data||{};
    const sheetEmpty=KEYS.every(k=>!(d[k]||[]).length),localHas=KEYS.some(k=>S[k].length);
    if(opts.first&&sheetEmpty&&localHas){
      KEYS.forEach(k=>{last[k]={};save(k)});
    }else{
      KEYS.forEach(k=>{S[k]=Array.isArray(d[k])?d[k]:[];lsSet(k,S[k]);last[k]=snap(S[k])});
    }
    if(Array.isArray(d.supps)){SUPPS=d.supps;lsSet("supps",SUPPS)}
    if(j.site){SITE={...SITE_DEF,...j.site};lsSet("site",SITE)}
    NET.imported=j.imported||0;
    NET.done++;render();          // 시트 내용은 받자마자 먼저 보여줘요
    await calP;
    const dur=Date.now()-NET.t0,old=lsGet("loadMs");lsSet("loadMs",Math.round(old?old*0.6+dur*0.4:dur));
    NET.state="ok";NET.msg="";NET.at=Date.now();
  }catch(e){if(!(e&&e.code==="pending")){NET.state="err";NET.msg=errMsg(e)}}
  loading=false;render();
}

/* ---------- Google Calendar (via the same web app) ---------- */
let G={events:lsGet("gcal")||[],cov:lsGet("gcalcov"),state:lsGet("gcalcov")?"ok":"idle",msg:"",key:""};
function gNeed(){
  const[y,m]=V.month.split("-").map(Number);
  const first=new Date(y,m-1,1),start=new Date(first);start.setDate(1-first.getDay());
  const end=new Date(start);end.setDate(start.getDate()+42);
  let a=ymd(start),b=ymd(end);const t=today(),t8=addDays(t,8);
  if(t<a)a=t;if(t8>b)b=t8;return[a,b];
}
function gWindow(){ // 지난달~다음달까지 한 번에 받아서 달을 넘길 때 기다리지 않게
  const[y,m]=V.month.split("-").map(Number);
  const s=new Date(y,m-2,1);s.setDate(1-s.getDay());
  const e=new Date(y,m+1,1);e.setDate(e.getDate()+14);
  let a=ymd(s),b=ymd(e);const t=today(),t8=addDays(t,8);
  if(t<a)a=t;if(t8>b)b=t8;return[a,b];
}
async function gLoad(force,nocache){
  if(!CFG.url)return;
  const[na,nb]=gNeed();
  const covered=!!(G.cov&&G.cov[0]<=na&&G.cov[1]>=nb);
  if(covered&&!force)return;
  const[a,b]=gWindow(),key=a+b+(nocache?"!":"");G.key=key;
  if(!covered){G.state="loading";render()}
  try{
    const eg=window.__EARLY_GCAL;window.__EARLY_GCAL=null;let j=null;
    if(eg&&eg.key===a+b&&!nocache){try{j=await readJson(await eg.res)}catch(e){j=null}}
    if(!j)j=await apiGet({action:"gcal",from:a,to:b,...(nocache?{nocache:"1"}:{})});
    if(G.key!==key)return;
    G.events=(j.events||[]).map(e=>({...e,id:"g_"+e.id,g:true,cat:e.hol?"hol":"g",
      title:e.hol?holKo(e.title):e.title}));
    G.cov=[a,b];lsSet("gcal",G.events);lsSet("gcalcov",G.cov);G.state="ok";G.msg="";
  }catch(e){if(G.key!==key)return;G.state="err";G.msg=errMsg(e)}
  render();
}
const allEvents=()=>S.events.concat(G.events);

/* ---------- 오늘의 날씨 (Open-Meteo, 키 없이 무료) ---------- */
let WX=lsGet("wx");   // {at, t, hi, lo, pop, code, day}
function wxInfo(c,day){
  if(c===0)return[day?"sun":"moon","맑음"];
  if(c<=2)return[day?"sun":"moon","구름 조금"];
  if(c===3)return["cloud","흐림"];
  if(c===45||c===48)return["cloud","안개"];
  if((c>=51&&c<=67)||(c>=80&&c<=82))return["drop",c<=57?"이슬비":"비"];
  if((c>=71&&c<=77)||c===85||c===86)return["cloud","눈"];
  if(c>=95)return["drop","뇌우"];
  return["cloud","흐림"];
}
function wxHtml(){
  const h=new Date().getHours(),day=h>=6&&h<18;
  if(!WX)return ic(day?"sun":"moon");
  const[icn,txt]=wxInfo(WX.code,WX.day);
  return `${ic(icn)}${txt} ${Math.round(WX.t)}° <small>${Math.round(WX.lo)}°/${Math.round(WX.hi)}°${WX.pop!=null?` · 비 ${WX.pop}%`:""}</small>`;
}
function wxTip(){ // 기온·비 확률로 옷차림 추천
  if(!WX)return"";
  const hi=WX.hi,lo=WX.lo,pop=WX.pop??0,c=WX.code,tips=[];
  const wear=hi>=28?"민소매·반팔, 최대한 시원하게":hi>=23?"반팔·얇은 셔츠":hi>=20?"얇은 긴팔·면바지":hi>=17?"맨투맨·얇은 니트·가디건":
    hi>=12?"자켓·가디건·니트":hi>=9?"트렌치코트·야상":hi>=5?"코트·히트텍":"패딩·목도리 꽁꽁";
  tips.push(`👗 ${wear}`);
  const rainNow=(c>=51&&c<=67)||(c>=80&&c<=82)||c>=95;
  if(rainNow||pop>=60)tips.push("☂️ 우산 꼭 챙기세요");
  else if(pop>=30)tips.push("🌂 작은 우산 챙기면 좋아요");
  if((c>=71&&c<=77)||c===85||c===86)tips.push("⛄ 눈 와요, 미끄럼 조심");
  if(hi-lo>=8&&lo<20)tips.push("🧥 아침저녁 쌀쌀해요, 겉옷 챙기세요");
  else if(lo<12&&hi>=17)tips.push("🧥 얇은 겉옷 하나 챙기세요");
  if(hi>=30)tips.push("💧 더워요, 물 챙기세요");
  if(lo<=0)tips.push("🧤 장갑도 챙기세요");
  return tips.map(t=>`<span>${t}</span>`).join("");
}
function wxPos(){ // 위치 정보는 받지 않고 항상 서울 기준
  return Promise.resolve({lat:37.5665,lon:126.978});
}
let wxBusy=false;
async function wxLoad(){
  if(wxBusy||(WX&&Date.now()-WX.at<30*60e3&&WX.d===today()))return;
  wxBusy=true;
  try{
    const p=await wxPos();
    const u=`https://api.open-meteo.com/v1/forecast?latitude=${p.lat}&longitude=${p.lon}&current=temperature_2m,weather_code,is_day&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FSeoul&forecast_days=1`;
    const j=await (await fetch(u)).json();
    WX={at:Date.now(),d:today(),t:j.current.temperature_2m,code:j.current.weather_code,day:!!j.current.is_day,
        hi:j.daily.temperature_2m_max[0],lo:j.daily.temperature_2m_min[0],pop:j.daily.precipitation_probability_max?.[0]??null};
    lsSet("wx",WX);
    const el=document.getElementById("wx");if(el)el.innerHTML=wxHtml();
    const tp=document.getElementById("wxtip");if(tp){tp.innerHTML=wxTip();tp.hidden=!WX}
  }catch(e){}
  wxBusy=false;
}

/* ---------- chrome: top bar, drawer, sync badge ---------- */
function paintSync(){
  const b=document.getElementById("sync");if(!b)return;
  const st=NET.state;
  b.className="sync "+(st==="ok"?"ok":st==="busy"?"busy":st==="err"?"err":"");
  const load=st==="busy"&&NET.mode==="load";
  b.querySelector("span").textContent=st==="ok"?"동기화됨":st==="busy"?(load?`불러오는 중 ${NET.done}/${NET.total} · ${Math.floor((Date.now()-NET.t0)/1000)}초`:"저장 중"):st==="err"?"연결 오류":"이 기기만";
  // 진행 막대: 지난번 걸린 시간을 기준으로 채우고, 끝나기 전에는 95%에서 멈춰요
  const est=lsGet("loadMs")||3000,el=Date.now()-(NET.t0||Date.now());

  b.querySelector(".pg b").style.width=pct+"%";

}

function evRow(e,showDate){

    <div class="body" data-edit="event" data-id="${e.id}"><div class="t">${ic(stickerOf(e),"stk")}${esc(e.title)}</div><div class="sub">${sub}</div></div></div>`;
}
function todoRow(t){
  const td=today();let due="";
  if(t.due){const dd=diffDays(td,t.due);
    if(!t.done&&dd>0)due=`<span class="late">${ic("bang")}${dd}일 지남</span>`;
    else if(t.due===td)due=`<span>오늘까지</span>`;
    else due=`<span>${fmtDate(t.due)}까지</span>`;}
  return `<div class="row ${t.done?"done":""}"><button class="check ${t.done?"on":""}" data-toggle="${t.id}" aria-label="${t.done?"완료 취소":"완료"}"></button>
    <div class="body" data-edit="todo" data-id="${t.id}"><div class="t">${t.important?'<i class="ic i-star star-ic" role="img" aria-label="중요"></i> ':""}${esc(t.title)}</div>
    <div class="sub"><span class="tag ${t.cat}">${CATS[t.cat]||"개인"}</span>${due}</div></div></div>`;
}
const list=(rows,emptyMsg,addType)=>`<div class="list">${rows.length?rows.join(""):`<div class="empty">${kit("k_sleep")}${emptyMsg} ${addType?`<button data-add="${addType}">추가하기</button>`:""}</div>`}</div>`;
const fresh=t=>!t.done||(t.doneAt&&Date.now()-t.doneAt<86400000); // 완료 후 24시간은 목록에 남김
function sortTodos(a){
  return a.slice().sort((x,y)=>{
    if(x.done!==y.done)return x.done?1:-1;
    if(!!x.important!==!!y.important)return x.important?-1:1;
    const dx=x.due||"9999",dy=y.due||"9999";
    return dx<dy?-1:dx>dy?1:(x.created||0)-(y.created||0);
  });
}
const byTime=(a,b)=>(a.date+(a.time||"00:00"))<(b.date+(b.time||"00:00"))?-1:1;
function duoEv(e){
  const inner=`<span class="bar ${e.cat}"></span><div class="body"><div class="dt">${e.time?esc(e.time):"종일"}${e.g?` · ${e.cat==="hol"?"공휴일":"구글"}`:""}</div><div class="t">${ic(stickerOf(e),"stk")}${esc(e.title)}</div></div>`;
  return e.g?`<div class="drow" style="cursor:default">${inner}</div>`:`<div class="drow" data-edit="event" data-id="${e.id}">${inner}</div>`;
}
function duoTd(t){
  const dd=t.due?diffDays(today(),t.due):0;
  return `<div class="drow ${t.done?"done":""}"><button class="check ${t.done?"on":""}" data-toggle="${t.id}" aria-label="${t.done?"완료 취소":"완료"}"></button>
    <div class="body" data-edit="todo" data-id="${t.id}"><div class="t">${t.important?'<i class="ic i-star star-ic" role="img" aria-label="중요"></i> ':""}${esc(t.title)}</div>
    ${dd>0?`<div class="dt late">${ic("bang")}${dd}일 지남</div>`:""}</div></div>`;
}
function banner(){
  if(!CFG.url)return `<div class="banner">지금은 이 기기에만 저장돼요. 스프레드시트를 연결하면 모든 기기에서 같이 쓸 수 있어요. <button data-tab="settings">연결하기</button></div>`;

/* ---------- views ---------- */
function calBlock(f,sel=V.sel){
  const pG=x=>f==="all"||x.cat===f||(f==="g"&&x.g),pF=x=>f==="all"||x.cat===f;
  const[y,m]=V.month.split("-").map(Number);
  const first=new Date(y,m-1,1),start=new Date(first);start.setDate(1-first.getDay());
  const td=today();let cells="";const AE=allEvents();
  const evKey=e=>e.cat+"|"+e.title;
  const dayKeys=ds=>new Set(AE.filter(e=>e.date===ds&&!e.time&&pG(e)&&e.cat!=="hol").map(evKey));
  for(let i=0;i<42;i++){
    const d=new Date(start);d.setDate(start.getDate()+i);const s=ymd(d);
    if(i===35&&d.getMonth()!==m-1)break;
    const pAll=dayKeys(addDays(s,-1)),nAll=dayKeys(addDays(s,1));
    const pk=i%7===0?new Set():pAll,nk=i%7===6?new Set():nAll;
    const multi=e=>!e.time&&(pAll.has(evKey(e))||nAll.has(evKey(e)));
    const evs=AE.filter(e=>e.date===s&&pG(e)&&e.cat!=="hol").sort((a,b)=>(multi(b)-multi(a))||byTime(a,b));
    const hol=AE.filter(e=>e.date===s&&e.cat==="hol");
    const tds=f==="g"?[]:S.todos.filter(t=>t.due===s&&!t.done&&pF(t));
    cells+=`<button class="cell ${d.getMonth()!==m-1?"out":""} ${s===td?"today":""} ${s===sel?"sel":""} ${hol.length?"holiday":""}" data-day="${s}" aria-label="${d.getMonth()+1}월 ${d.getDate()}일, 일정 ${evs.length}개">
      <span class="n">${d.getDate()}</span>
      ${(()=>{const st=evs.map(stickerOf).find(Boolean);return st?ic(st,"cstk"):""})()}
      ${hol.slice(0,1).map(e=>`<span class="lbl hol">${ic("sakura")}${esc(e.title)}</span>`).join("")}
      <span class="dots">${evs.slice(0,4).map(e=>`<i class="${e.cat}"></i>`).join("")}${tds.length?'<i style="background:var(--soft)"></i>':""}</span>
      ${evs.slice(0,3).map(e=>{const k=evKey(e),l=!e.time&&pk.has(k),r=!e.time&&nk.has(k);return `<span class="lbl ${e.cat}${e.time?" tm":""}${l?" cl":""}${r?" cr":""}">${l?"&nbsp;":esc(e.title)}</span>`}).join("")}
      ${evs.length>3?`<span class="lbl" style="display:block;color:var(--soft)">+${evs.length-3}</span>`:""}
    </button>`;
  }
  const gs=!CFG.url?"":G.state==="err"?`<div class="gstat warn">구글 캘린더: ${esc(G.msg)}</div>`:G.state==="loading"?`<div class="gstat">구글 캘린더 불러오는 중…</div>`:G.state==="ok"?`<div class="gstat">구글 캘린더 연동됨</div>`:"";
  return `<div class="calhead"><div class="ym">${y}년 ${m}월</div>
    <button class="iconbtn" data-mon="-1" aria-label="이전 달">‹</button>
    <button class="textbtn" data-mon="0">오늘</button>
    <button class="iconbtn" data-mon="1" aria-label="다음 달">›</button></div>
  <div class="grid">${WD.map((w,i)=>`<div class="dow ${i===0?"sun":i===6?"sat":""}">${w}</div>`).join("")}${cells}</div>${gs}`;
}

  </div>
  ${S.habits.length?`<h2>오늘의 루틴 <small>${S.habits.filter(x=>x.log?.[td]).length}/${S.habits.length}</small></h2>

  ${pinned.length?`<h2>고정한 메모</h2><div class="notes">${pinned.map(noteCard).join("")}</div>`:""}

    ${someday.map(todoRow).join("")}
  </div>`;
}

function vSettings(){

  return `<div class="settings">
  <h2 style="margin-top:4px">스프레드시트 연결</h2>
  <p>웹 앱 주소는 미리 넣어 두었어요. 스프레드시트 '안내' 탭의 토큰만 넣고 연결하기를 누르세요. 기기마다 한 번씩만 하면 돼요.</p>
  <div class="field"><label for="s_url">웹 앱 주소</label><input id="s_url" type="url" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(CFG.url||DEFAULT_API)}" autocomplete="off"></div>
  <div class="field"><label for="s_tok">토큰</label><input id="s_tok" placeholder="안내 탭의 토큰" value="${esc(CFG.token)}" autocomplete="off"></div>
  <div class="rowbtns"><button class="btn primary" data-connect>연결하기</button>${CFG.url?`<button class="btn ghost" data-disconnect>연결 해제</button>`:""}</div>
  <div class="result ${NET.state==="ok"?"ok":NET.state==="err"?"err":""}" id="s_res">${NET.state==="ok"&&CFG.url?kit("k_wink"):""}${esc(st)}</div>
  <h2>백업</h2>
  <p>지금 화면에 있는 모든 데이터를 JSON 파일로 저장해요.</p>
  <div class="rowbtns"><button class="btn ghost" data-export>백업 파일 받기</button></div>
  </div>`;
}

function render(){
  renderChrome();paintSupp();
  const m=document.getElementById("main");
  m.innerHTML={today:vToday,cal:vCal,todo:vTodo,note:vNote,habit:vHabit,settings:vSettings}[V.tab]();
  document.getElementById("fab").classList.toggle("hide",V.tab==="settings");
  if(V.tab==="today")wxLoad();
  const q=document.getElementById("q");
  if(q)q.addEventListener("input",()=>{V.q=q.value;const p=q.selectionStart;render();const n=document.getElementById("q");n.focus();n.setSelectionRange(p,p)});
}

/* ---------- interactions ---------- */
document.getElementById("main").addEventListener("click",async e=>{
  const g=s=>e.target.closest(s);let el;
  if(el=g("[data-f]")){V.filter=el.dataset.f;render();return}
  if(el=g("[data-mon]")){const v=+el.dataset.mon;
    if(v===0){V.month=today().slice(0,7);V.sel=today()}
    else{const[y,m]=V.month.split("-").map(Number);V.month=ymd(new Date(y,m-1+v,1)).slice(0,7)}
    gLoad();render();return}
  if(el=g("[data-day]")){const s=el.dataset.day;
    if(V.tab==="today"){
      V.homeSel=V.homeSel===s?null:s;
      if(s.slice(0,7)!==V.month){V.month=s.slice(0,7);gLoad()}
      render();
      const b=document.getElementById("daybox");
      if(b){const r=b.getBoundingClientRect();if(r.bottom>innerHeight)b.scrollIntoView({behavior:"smooth",block:"nearest"})}
      return}
    if(V.sel===s&&window.matchMedia("(min-width:640px)").matches){openSheet("event",null,{date:s});return}
    V.sel=s;if(s.slice(0,7)!==V.month){V.month=s.slice(0,7);gLoad()}render();return}
  if(el=g("[data-toggle]")){const t=S.todos.find(x=>x.id===el.dataset.toggle);if(t){t.done=!t.done;t.doneAt=t.done?Date.now():null;save("todos");render()}return}
  if(el=g("[data-hday]")){const[id,d]=el.dataset.hday.split("|");const h=S.habits.find(x=>x.id===id);
    if(h){h.log={...(h.log||{})};if(h.log[d])delete h.log[d];else h.log[d]=true;save("habits");render()}return}
  if(el=g("[data-shop]")){const x=S.shop.find(i=>i.id===el.dataset.shop);if(x){x.done=!x.done;save("shop");render()}return}
  if(el=g("[data-shopdel]")){S.shop=S.shop.filter(i=>i.id!==el.dataset.shopdel);save("shop");render();return}
  if(g("[data-shopclear]")){S.shop=S.shop.filter(i=>!i.done);save("shop");render();return}
  if(el=g("[data-edit]")){const t=el.dataset.edit;const k={event:"events",todo:"todos",note:"notes",habit:"habits"}[t];
    openSheet(t,S[k].find(x=>x.id===el.dataset.id));return}
  if(el=g("[data-add]")){const inDay=el.closest("#daybox");openSheet(el.dataset.add,null,V.tab==="cal"?{date:V.sel}:inDay?{date:V.homeSel}:{});return}
  if(g("[data-dayclose]")){V.homeSel=null;render();return}
  if(g("[data-showdone]")){V.showDone=!V.showDone;render();return}
  if(g("[data-reload]")){loadAll({force:true});return}
  if(g("[data-connect]")){
    const url=document.getElementById("s_url").value.trim(),tok=document.getElementById("s_tok").value.trim();
    const res=document.getElementById("s_res");
    if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)){res.className="result err";res.textContent="웹 앱 주소는 https://script.google.com/… 으로 시작해요.";return}
    if(!tok){res.className="result err";res.textContent="토큰을 입력해 주세요.";return}
    res.className="result";res.textContent="연결 확인 중…";
    try{await apiGet({action:"ping"},{url,token:tok})}
    catch(err){res.className="result err";res.textContent=errMsg(err);return}
    CFG.url=url;CFG.token=tok;lsSet("api",url);lsSet("token",tok);
    await loadAll({first:true});return}
  if(g("[data-disconnect]")){if(!confirm("이 기기에서 스프레드시트 연결을 해제할까요? 스프레드시트 데이터는 그대로 남아요."))return;
    CFG.url="";CFG.token="";lsSet("api","");lsSet("token","");NET.state="local";G.events=[];G.cov=null;lsSet("gcal",[]);lsSet("gcalcov",null);render();return}
  if(g("[data-export]")){
    const blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),...S},null,2)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="eunji-hub-backup-"+today()+".json";
    document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);return}
});
document.getElementById("main").addEventListener("submit",e=>{
  const f=e.target.closest("[data-quick]");if(!f)return;e.preventDefault();
  const inp=f.querySelector("input");const v=inp.value.trim();if(!v){inp.focus();return}
  if(f.dataset.quick==="shop"){S.shop.push({id:newId(),title:v,done:false,created:Date.now()});save("shop")}
  else{S.todos.push({id:newId(),title:v,cat:"life",due:"",important:false,done:false,doneAt:null,created:Date.now()});save("todos")}
  const which=f.dataset.quick;render();
  const n=document.querySelector(`[data-quick="${which}"] input`);n&&n.focus();
});
document.getElementById("fab").addEventListener("click",()=>{
  const map={today:"todo",cal:"event",todo:"todo",note:"note",habit:"habit"};
  openSheet(map[V.tab],null,V.tab==="cal"?{date:V.sel}:{});
});

/* ---------- sheet (add / edit) ---------- */
const scrim=document.getElementById("scrim"),sheet=document.getElementById("sheet");
let lastFocus=null;
function closeSheet(){scrim.classList.remove("open");lastFocus&&lastFocus.focus()}
scrim.addEventListener("click",e=>{if(e.target===scrim)closeSheet()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&scrim.classList.contains("open"))closeSheet()});
function openSheet(type,item,preset={}){
  lastFocus=document.activeElement;
  const isNew=!item;
  const cat=item?.cat||(["work","life","play"].includes(V.filter)?V.filter:"work");
  const names={event:"일정",todo:"할일",note:"메모",habit:"루틴"};
  const seg=isNew?`<div class="seg" role="group">${Object.entries(names).map(([k,l])=>`<button type="button" data-type="${k}" aria-pressed="${k===type}">${l}</button>`).join("")}</div>`:"";
  const catsHtml=`<div class="field"><label>분류</label><div class="cats">${Object.entries(CATS).map(([k,l])=>`<button type="button" class="${k}" data-cat="${k}" aria-pressed="${k===cat}">${l}</button>`).join("")}</div></div>`;
  let f="";
  if(type==="event")f=`
    <div class="field"><label for="f_title">일정</label><input id="f_title" value="${esc(item?.title)}" placeholder="예: 위험물기능사 필기 촬영"></div>
    <div class="two"><div class="field"><label for="f_date">날짜</label><input id="f_date" type="date" value="${item?.date||preset.date||today()}"></div>
    <div class="field"><label for="f_time">시간 (비우면 종일)</label><input id="f_time" type="time" value="${item?.time||""}"></div></div>
    ${catsHtml}
    <div class="field"><label for="f_note">메모</label><input id="f_note" value="${esc(item?.note)}" placeholder="장소, 준비물 등"></div>
    <div class="field"><label>스티커</label><div class="stickers" role="group" aria-label="스티커">
      <button type="button" data-stk="" aria-pressed="${!item?.sticker}"><span style="height:28px;display:grid;place-items:center;font-size:18px">✦</span>자동</button>
      <button type="button" data-stk="none" aria-pressed="${item?.sticker==="none"}"><span style="height:28px;display:grid;place-items:center;font-size:16px">∅</span>없음</button>
      ${STICKERS.map(([k,l])=>`<button type="button" data-stk="${k}" aria-pressed="${item?.sticker===k}">${ic(k)}${l}</button>`).join("")}
    </div></div>`;
  if(type==="todo")f=`
    <div class="field"><label for="f_title">할일</label><input id="f_title" value="${esc(item?.title)}" placeholder="예: 교안 제작"></div>
    <div class="field"><label for="f_due">마감일 (비우면 언젠가 할 일)</label><input id="f_due" type="date" value="${item?.due||preset.date||""}"></div>
    ${catsHtml}
    <label class="toggle"><input type="checkbox" id="f_imp" ${item?.important?"checked":""}> 중요한 일로 표시</label>`;
  if(type==="note")f=`
    <div class="field"><label for="f_title">제목</label><input id="f_title" value="${esc(item?.title)}"></div>
    <div class="field"><label for="f_body">내용</label><textarea id="f_body">${esc(item?.body)}</textarea></div>
    ${catsHtml}
    <label class="toggle"><input type="checkbox" id="f_pin" ${item?.pinned?"checked":""}> 오늘 화면에 고정</label>`;
  if(type==="habit")f=`
    <div class="field"><label for="f_title">루틴 이름</label><input id="f_title" value="${esc(item?.name)}" placeholder="예: 스트레칭 10분"></div>
    ${catsHtml}`;
  sheet.innerHTML=`<h3>${isNew?"새로 추가":names[type]+" 수정"}</h3>${seg}<form id="sf">${f}
    <div class="actions">${!isNew?`<button type="button" class="btn danger" id="del">삭제</button>`:""}
    <button type="button" class="btn ghost" id="cancel">취소</button><button type="submit" class="btn primary">${isNew?"추가":"저장"}</button></div></form>`;
  scrim.classList.add("open");
  setTimeout(()=>{const t=document.getElementById(type==="note"&&item?"f_body":"f_title");t&&t.focus()},50);
  let curCat=cat,curStk=item?.sticker||"";
  sheet.querySelectorAll("[data-stk]").forEach(b=>b.onclick=()=>{curStk=b.dataset.stk;sheet.querySelectorAll("[data-stk]").forEach(x=>x.setAttribute("aria-pressed",x===b))});
  sheet.querySelectorAll("[data-type]").forEach(b=>b.onclick=()=>openSheet(b.dataset.type,null,preset));
  sheet.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{curCat=b.dataset.cat;sheet.querySelectorAll("[data-cat]").forEach(x=>x.setAttribute("aria-pressed",x===b))});
  document.getElementById("cancel").onclick=closeSheet;
  const key={event:"events",todo:"todos",note:"notes",habit:"habits"}[type];
  const del=document.getElementById("del");
  if(del)del.onclick=()=>{if(!confirm("삭제할까요?"))return;S[key]=S[key].filter(x=>x.id!==item.id);save(key);closeSheet();render()};
  document.getElementById("sf").onsubmit=e=>{
    e.preventDefault();
    const v=id=>document.getElementById(id)?.value?.trim()??"";
    const title=v("f_title");
    if(type!=="note"&&!title){const t=document.getElementById("f_title");t.focus();t.setAttribute("aria-invalid","true");t.placeholder="내용을 입력해 주세요";return}
    if(type==="note"&&!title&&!v("f_body")){document.getElementById("f_body").focus();return}
    const o=item?{...item}:{id:newId(),created:Date.now()};
    o.cat=curCat;
    if(type==="event"){o.title=title;o.date=v("f_date")||today();o.time=v("f_time");o.note=v("f_note");o.sticker=curStk}
    if(type==="todo"){o.title=title;o.due=v("f_due");o.important=document.getElementById("f_imp").checked;if(isNew){o.done=false;o.doneAt=null}}
    if(type==="note"){o.title=title;o.body=document.getElementById("f_body").value;o.pinned=document.getElementById("f_pin").checked;o.updated=Date.now()}
    if(type==="habit"){o.name=title;o.log=o.log||{}}
    if(isNew)S[key].push(o);else S[key]=S[key].map(x=>x.id===o.id?o:x);
    save(key);closeSheet();
    if(type==="event"&&isNew&&V.tab==="cal"){V.sel=o.date;if(o.date.slice(0,7)!==V.month){V.month=o.date.slice(0,7);gLoad()}}
    render();
  };
}

/* refresh when coming back to the page */
let hiddenAt=0;
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){hiddenAt=Date.now();return}
  render();if(CFG.url&&Date.now()-hiddenAt>60000)loadAll();
});
window.addEventListener("online",()=>{if(CFG.url){flush();loadAll()}});
render();
if(CFG.url)loadAll({first:FIRST_CONNECT});
if("serviceWorker" in navigator&&location.protocol==="https:"){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
})();

</script>
</body>
</html>
